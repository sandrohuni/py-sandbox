# Run init.sh --sandbox on the HOST after editing. Paths refer to the host.
# "." is required: the project itself is writable. All listed directories must exist.
read_and_write:
  - .
  # - ../shared-code
  # - $HOME/experiments/runs
read_only: []
  # To add data, replace [] with a list:
  # - $HOME/datasets/my-data

engine: docker                 # docker or podman (devcontainer only)
agent: claude                  # default sbx agent: claude or codex
memory: 8g                     # devcontainer and sbx
cpus: 2                        # 0 = runtime default
shm_size: 1g                   # devcontainer shared memory
gpu: false                     # optional; requires host GPU/runtime support
network_allow: []              # sbx policy additions; containers keep normal networking
  # - pypi.org
  # - files.pythonhosted.org
